global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - user-service:8081
          - product-service:8082
          - ai-service:8084
        labels:
          service: ecommerce

  # Profundidad del docker-compose --profile apps
  # Para desarrollo local (apps fuera de Docker), usa host.docker.internal:
  # - job_name: 'spring-boot-local'
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets:
  #         - host.docker.internal:8080
  #         - host.docker.internal:8081
  #         - host.docker.internal:8082
  #         - host.docker.internal:8084