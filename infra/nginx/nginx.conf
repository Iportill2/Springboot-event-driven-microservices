worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream backend {
        # En Docker hace referencia al contenedor del gateway.
        # Para desarrollo local usa: server 127.0.0.1:8080;
        server gateway:8080;
    }

    # Redirige todo el trafico HTTP a HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # Certificado autofirmado generado por el contenedor ssl-init
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Build de la SPA Vue (frontend/dist), montado como volumen
        root /usr/share/nginx/html;
        index index.html;

        # API -> Spring Cloud Gateway (microservicios)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte WebSocket (Chat Service)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # SPA: sirve los estaticos y cae a index.html para rutas del router
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}