name: compose verify

# Valida que infra/docker-compose.yml es correcto (variables, perfiles, rutas)
# usando .env.example, sin levantar nada.

on:
  push:
    branches: [main]
    paths:
      - 'infra/docker-compose.yml'
      - 'infra/postgres/**'
      - 'infra/nginx/**'
      - 'infra/ssl-init/**'
      - '.env.example'
      - '.github/workflows/compose-verify.yml'
  pull_request:
    paths:
      - 'infra/docker-compose.yml'
      - 'infra/postgres/**'
      - 'infra/nginx/**'
      - 'infra/ssl-init/**'
      - '.env.example'
      - '.github/workflows/compose-verify.yml'

jobs:
  verify:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose --env-file .env.example -f infra/docker-compose.yml --profile apps --profile async --profile ai config --quiet