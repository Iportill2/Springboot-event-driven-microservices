name: Service pipeline (reutilizable)

# Workflow reutilizable: compila y testea un módulo Maven (junto a shared/common)
# y construye su imagen Docker. Cada workflow de servicio lo invoca con `module`.
#
# Uso:
#   jobs:
#     pipeline:
#       uses: ./.github/workflows/service-pipeline.yml
#       with:
#         module: user

on:
  workflow_call:
    inputs:
      module:
        description: 'Modulo Maven a construir (gateway, user, product, ai)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Compilar y testear ${{ inputs.module }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y tests (modulo + common)
        run: mvn -B -ntp -pl services/${{ inputs.module }} -am package

  docker-image:
    name: Imagen Docker de ${{ inputs.module }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin push, sin desplegar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: |
            MODULE=${{ inputs.module }}
          tags: ecommerce/${{ inputs.module }}-service:ci
          push: false